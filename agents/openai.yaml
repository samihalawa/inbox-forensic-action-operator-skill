interface:
  display_name: "Inbox Forensic Action Operator"
  short_description: "Reconstruct cross-channel truth, then execute verified actions"
  default_prompt: "Use $inbox-forensic-action-operator-skill to separate discovery scope, output filter, and mutation authority. For bounded requests, inspect the named sources and window, widening only when current evidence is ambiguous or cross-channel state matters. For all/again/no-assumptions/offer-or-acceptance/recovery requests, fan out across every relevant Gmail identity, exact Close records, verified meetings, current GOWA devices, calendars, ATS/provider pages, and authenticated forms. Reconstruct event-time timelines, apply strict proof gates, execute only explicitly authorized mutation classes, always require final live-send confirmation, and verify every mutation at the same external layer."
