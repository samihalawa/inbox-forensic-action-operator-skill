interface:
  display_name: "Inbox Forensic Action Operator"
  short_description: "Reconstruct cross-channel truth, then execute verified actions"
  default_prompt: "Use $inbox-forensic-action-operator-skill to separate discovery scope, output filter, and mutation authority. Inventory exact account/device identities, recover through alternate source routes when one connector fails, enforce absolute event-time bounds, chronological ordering, cursor exhaustion, stable-ID deduplication, and declared-total reconciliation. For all/again/no-assumptions/offer-or-acceptance/recovery requests, fan out across every relevant Gmail identity, exact Close records, entity-bound meeting intervals, every current GOWA device and raw JID domain, calendars, ATS/provider pages, and authenticated forms. Apply strict proof gates, execute only explicitly authorized mutation classes, always require final live-send confirmation, and verify every mutation at the same external layer."
